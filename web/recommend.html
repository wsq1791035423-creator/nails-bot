<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选款推荐 · Demo</title>
<style>
  :root {
    --bg: #faf6f4; --card: #fff; --ink: #2f2a2c; --muted: #8b8186;
    --line: #eee4e0; --rose: #c96f7f; --rose-soft: #f6e3e4; --warn: #8a6a12;
    --warn-bg: #fdf5e3; --danger: #b3453f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { max-width: 1180px; margin: 0 auto; padding: 26px 20px 4px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { margin-top: 10px; display: flex; gap: 16px; font-size: 13px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--rose); }
  nav a.on { color: var(--rose); font-weight: 600; }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding: 16px 20px 60px;
    display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; position: sticky; top: 16px;
  }
  @media (max-width: 900px) { .panel { position: static; } }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .5px; margin-bottom: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 12.5px; color: #6f6468;
    font-family: inherit;
  }
  .chip.on { background: var(--rose); border-color: var(--rose); color: #fff; }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input { flex: 1; accent-color: var(--rose); }
  .range-row b { color: var(--rose); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }

  .results-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
  }
  .results-head h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .summary { font-size: 12.5px; color: var(--muted); }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .style-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    display: grid; grid-template-columns: 150px 1fr; overflow: hidden;
  }
  @media (max-width: 620px) { .style-card { grid-template-columns: 1fr; } }
  .sc-img { background: #f2ebe8; min-height: 180px; }
  .sc-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sc-body { padding: 14px 16px 16px; }
  .sc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .sc-name { font-size: 16px; font-weight: 600; line-height: 1.35; }
  .sc-price { text-align: right; white-space: nowrap; }
  .sc-price .num { font-size: 21px; font-weight: 700; color: var(--rose); font-variant-numeric: tabular-nums; }
  .sc-price .dur { font-size: 11.5px; color: var(--muted); }
  .reason { margin: 8px 0 8px; font-size: 13px; color: #5d5256; }
  .reason .dot { color: var(--rose); }
  .extra { margin: -2px 0 8px; font-size: 12px; color: var(--warn); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--rose-soft); color: #8a4b57; }
  .tag.dim { background: #f3eeec; color: var(--muted); }
  .warnline { margin-top: 8px; font-size: 11.5px; color: var(--warn); background: var(--warn-bg); display: inline-block; padding: 2px 9px; border-radius: 7px; }
  .detail { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; display: none; }
  .detail.on { display: block; }
  .detail .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 2px 0; color: var(--muted); }
  .detail .row b { color: var(--ink); font-weight: 500; }
  .more {
    margin-top: 8px; background: none; border: 0; color: var(--rose);
    font: inherit; font-size: 12.5px; cursor: pointer; padding: 0;
  }
  .empty { color: var(--muted); text-align: center; padding: 50px 20px; }

  .compare {
    margin-top: 20px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 18px;
  }
  .compare h3 { font-size: 13px; color: var(--muted); margin: 0 0 10px; letter-spacing: 1px; }
  .compare table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .compare td, .compare th {
    padding: 8px 8px; border-bottom: 1px dashed var(--line);
    text-align: left; vertical-align: top;
  }
  .compare th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .compare .price { color: var(--rose); font-weight: 700; white-space: nowrap; font-size: 15px; }
  .compare .dim { color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>选款推荐</h1>
  <div class="sub">报价统一按「本甲」算。想做延长（甲膜 65 / 高位半贴 69 / 浅贴 89）自己选，优缺点见下方说明。</div>
  <nav>
    <a href="/web/chat.html">AI 对话</a>
    <a href="/web/recommend.html" class="on">选款推荐</a>
    <a href="/web/gallery.html">款式图库</a>
    <a href="/web/">报价器</a>
  </nav>
</header>

<div class="wrap">
  <aside class="panel">
    <div class="field">
      <div class="label">你的手 / 肤色</div>
      <div class="chips" id="skin">
        <button class="chip" data-v="黄黑">偏黄黑</button>
        <button class="chip" data-v="冷白">偏白</button>
        <button class="chip on" data-v="">不确定</button>
      </div>
    </div>

    <div class="field">
      <div class="label">想要多长</div>
      <div class="chips" id="length">
        <button class="chip on" data-v="">都行</button>
        <button class="chip" data-v="短">短</button>
        <button class="chip" data-v="中">中</button>
        <button class="chip" data-v="中长">中长</button>
        <button class="chip" data-v="长">长</button>
      </div>
    </div>

    <div class="field">
      <div class="label">主要场合</div>
      <div class="chips" id="occasion">
        <button class="chip on" data-v="">不限</button>
        <button class="chip" data-v="日常">日常</button>
        <button class="chip" data-v="通勤">通勤</button>
        <button class="chip" data-v="约会">约会</button>
        <button class="chip" data-v="婚礼">婚礼</button>
        <button class="chip" data-v="拍照">拍照</button>
      </div>
    </div>

    <div class="field">
      <div class="label">喜欢的做法（可多选）</div>
      <div class="chips" id="keywords">
        <button class="chip" data-v="猫眼">猫眼</button>
        <button class="chip" data-v="法式">法式</button>
        <button class="chip" data-v="波点">波点</button>
        <button class="chip" data-v="手绘">手绘</button>
        <button class="chip" data-v="卡通">卡通</button>
        <button class="chip" data-v="腮红">腮红</button>
        <button class="chip" data-v="渐变">渐变</button>
        <button class="chip" data-v="魔镜粉">魔镜粉</button>
        <button class="chip" data-v="贴钻">贴钻</button>
        <button class="chip" data-v="纯色">纯色</button>
      </div>
    </div>

    <div class="field">
      <div class="label">能接受延长吗</div>
      <div class="chips" id="extend">
        <button class="chip on" data-v="any">都行</button>
        <button class="chip" data-v="no">不想延长</button>
        <button class="chip" data-v="yes">可以延长</button>
      </div>
    </div>

    <div class="field">
      <div class="label">预算（元）</div>
      <div class="range-row">
        <input type="range" id="budget" min="30" max="300" step="10" value="80">
        <b id="budgetVal">80</b>
      </div>
    </div>
  </aside>

  <main>
    <div class="results-head">
      <h2>给你挑的</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的款式，放宽一下条件试试</div>
    <div class="compare" id="compare"></div>
  </main>
</div>

<script type="module">
import { recommend } from "/src/recommend-core.mjs";

const $ = (id) => document.getElementById(id);
let PRICING = null, STYLES = [];
const sel = { skin: "", length: "", occasion: "", keywords: [], extend: "any", budget: 80 };

function bindSingle(id, key) {
  $(id).onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    [...$(id).children].forEach((c) => c.classList.toggle("on", c === b));
    sel[key] = b.dataset.v;
    render();
  };
}

function render() {
  const prefs = {
    skin: sel.skin || undefined,
    length: sel.length || undefined,
    occasion: sel.occasion || undefined,
    keywords: sel.keywords.length ? sel.keywords : undefined,
    wantExtend: sel.extend === "any" ? undefined : sel.extend === "yes",
    budget: sel.budget,
  };
  const res = recommend(PRICING, STYLES, prefs, 3);
  $("empty").style.display = res.length ? "none" : "block";
  $("summary").textContent = res.length
    ? `${res.length} 款 · 共 ${STYLES.length} 款里挑的`
    : "";

  $("cards").innerHTML = res.map((r, i) => `
    <article class="style-card">
      <div class="sc-img">${r.img ? `<img src="${r.img}" alt="${r.name}">` : ""}</div>
      <div class="sc-body">
        <div class="sc-top">
          <div>
            <div class="sc-name">${i + 1}. ${r.name}</div>
            <div class="tags" style="margin-top:6px">
              <span class="tag">${r.tags.color || "—"}</span>
              ${(r.tags.style || []).slice(0, 3).map((s) => `<span class="tag">${s}</span>`).join("")}
              <span class="tag dim">${r.tags.length || "—"}</span>
              <span class="tag dim">${r.tags.skin_effect || "—"}</span>
            </div>
          </div>
          <div class="sc-price">
            <div class="num">${r.priceText}</div>
            <div class="dur">${r.durationText}</div>
          </div>
        </div>
        <div class="reason"><span class="dot">—</span> ${r.reason}</div>
        ${r.extraText ? `<div class="extra">另计：${r.extraText}</div>` : ""}
        ${r.overBudget ? `<div class="warnline">比预算高一些</div>` : ""}
        ${r.priceConfirm ? `<div class="warnline">这款价格需人工确认</div>` : ""}
        <button class="more" data-i="${i}">看报价明细 ▾</button>
        <div class="detail" id="detail-${i}">
          ${r.lines.map((l) => `<div class="row"><span>${l.label}</span><b>${l.amount}</b></div>`).join("")}
          <div class="row"><span>合计</span><b>${r.priceText}</b></div>
        </div>
      </div>
    </article>`).join("");

  $("cards").querySelectorAll(".more").forEach((btn) => {
    btn.onclick = () => {
      const d = $("detail-" + btn.dataset.i);
      d.classList.toggle("on");
      btn.textContent = d.classList.contains("on") ? "收起明细 ▴" : "看报价明细 ▾";
    };
  });
}

function renderCompare() {
  const rows = PRICING.base
    .map(
      (b) => `
      <tr>
        <td><b>${b.name}</b><br><span class="dim">${b.suitable || ""}</span></td>
        <td class="price">¥${b.price}</td>
        <td>${b.pros || ""}${b.cons ? `<br><span class="dim">注意：${b.cons}</span>` : ""}</td>
      </tr>`
    )
    .join("");
  $("compare").innerHTML = `
    <h3>四种做法怎么选（价格按这档算，你说要哪个就按哪个）</h3>
    <table>
      <thead><tr><th>做法</th><th>价格</th><th>优点 / 注意</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

(function init() {
  bindSingle("skin", "skin");
  bindSingle("length", "length");
  bindSingle("occasion", "occasion");
  bindSingle("extend", "extend");

  $("keywords").onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    const v = b.dataset.v;
    b.classList.toggle("on");
    sel.keywords = [...$("keywords").querySelectorAll(".chip.on")].map((c) => c.dataset.v);
    render();
  };

  $("budget").oninput = (e) => {
    sel.budget = Number(e.target.value);
    $("budgetVal").textContent = sel.budget;
    render();
  };

  Promise.all([
    fetch("/knowledge/pricing.json").then((r) => r.json()),
    fetch("/knowledge/03_styles.jsonl").then((r) => r.text()),
  ]).then(([pricing, text]) => {
    PRICING = pricing;
    STYLES = text.split("\n").filter((l) => l.trim()).map((l) => JSON.parse(l));
    renderCompare();
    render();
  }).catch((e) => {
    $("cards").innerHTML = `<div class="empty">数据没加载出来：${e.message}（用 node src/server.mjs 启动）</div>`;
  });
})();
</script>
</body>
</html>
