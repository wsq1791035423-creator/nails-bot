<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美甲报价器 · Demo</title>
<style>
  :root {
    --bg: #faf6f4;
    --card: #ffffff;
    --ink: #2f2a2c;
    --muted: #8b8186;
    --line: #eee4e0;
    --rose: #c96f7f;
    --rose-soft: #f6e3e4;
    --gold: #b8860b;
    --warn-bg: #fdf5e3;
    --danger: #b3453f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 20px 8px;
    max-width: 1120px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  nav { margin-top: 10px; display: flex; gap: 16px; font-size: 13px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--rose); }
  nav a.on { color: var(--rose); font-weight: 600; }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 20px 64px;
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1.5px;
  }

  /* 基础项目 */
  .base-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .base-grid { grid-template-columns: 1fr; } }
  .base {
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: .15s;
    background: #fffdfc;
    position: relative;
  }
  .base:hover { border-color: #e3c6cc; }
  .base.on { border-color: var(--rose); background: var(--rose-soft); }
  .base .t { font-weight: 600; font-size: 14px; }
  .base .p { color: var(--rose); font-weight: 700; font-size: 18px; margin-top: 2px; }
  .base .p small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .base .d { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.45; }

  /* 款式行 */
  .style-row {
    display: grid;
    grid-template-columns: 1fr 110px 92px;
    gap: 10px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
  }
  .style-row:last-child { border-bottom: none; }
  .style-row .nm { font-size: 14px; }
  .style-row .rule { color: var(--muted); font-size: 11.5px; }
  .style-row input[type=range] { width: 100%; accent-color: var(--rose); }
  .style-row .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .style-row .val b { color: var(--rose); }
  .style-row.zero { opacity: .55; }

  /* 附加费 */
  .fee-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px dashed var(--line);
  }
  .fee-row:last-child { border-bottom: none; }
  .fee-row .nm { font-size: 14px; }
  .fee-row .pr { color: var(--muted); font-size: 12px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .stepper button:hover { border-color: var(--rose); color: var(--rose); }
  .stepper span { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }

  .late input {
    width: 74px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; text-align: right;
  }

  /* 报价面板 */
  aside { position: sticky; top: 16px; }
  @media (max-width: 860px) { aside { position: static; } }
  .quote-total {
    font-size: 40px; font-weight: 700; color: var(--rose);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .quote-total.cancelled { color: var(--danger); font-size: 26px; }
  .quote-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .lines { margin: 14px 0 0; padding: 0; list-style: none; }
  .lines li {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13.5px;
  }
  .lines li .note { color: var(--muted); font-size: 11.5px; display: block; }
  .lines li .amt { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pending {
    margin-top: 12px; background: var(--warn-bg); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; color: #7a5c12; line-height: 1.5;
  }
  .pending b { display: block; margin-bottom: 3px; }
  .btn {
    width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 11px;
    background: var(--ink); color: #fff; font: inherit; cursor: pointer;
  }
  .btn:hover { opacity: .88; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .foot { color: var(--muted); font-size: 11.5px; margin-top: 12px; line-height: 1.55; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>美甲报价器</h1>
  <p>选项目 → 拖手指数 → 实时出价。价格来自 knowledge/pricing.json，改价只改那一个文件。</p>
  <nav>
    <a href="/web/chat.html">AI 对话</a>
    <a href="/web/recommend.html">选款推荐</a>
    <a href="/web/gallery.html">款式图库</a>
    <a href="/web/" class="on">报价器</a>
  </nav>
</header>

<div class="wrap">
  <main>
    <section class="card">
      <h2>基础项目（含精细前置 + 建构）</h2>
      <div class="base-grid" id="baseGrid"></div>
    </section>

    <section class="card">
      <h2>款式加价（法式/波点/腮红/渐变/晕染 共用指次：每满 10 指次收 8 元）</h2>
      <div id="styleList"></div>
    </section>

    <section class="card">
      <h2>附加服务</h2>
      <div id="feeList"></div>
    </section>

    <section class="card">
      <h2>迟到</h2>
      <div class="late" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span>迟到</span>
        <input id="lateMin" type="number" min="0" max="120" value="0" step="1">
        <span>分钟</span>
        <span style="color:var(--muted);font-size:12px">10 分钟内免费；10–30 分钟每分钟 1 元；超 30 分钟取消</span>
      </div>
    </section>
  </main>

  <aside>
    <section class="card">
      <h2>报价</h2>
      <div class="quote-total" id="total">¥39</div>
      <div class="quote-sub" id="sub">约 2–2.7 小时</div>
      <ul class="lines" id="lines"></ul>
      <div id="pendingBox"></div>
      <button class="btn" id="copyBtn">复制报价文案</button>
      <button class="btn ghost" id="resetBtn">重置</button>
      <div class="foot">
        原型 demo：这里只做报价，还没有对话和款式推荐。<br>
        区间价（卡通、堆钻等）会标「需人工确认」。
      </div>
    </section>
  </aside>
</div>

<div class="toast" id="toast">已复制</div>

<script type="module">
import { quote } from "/src/pricing-core.mjs";

const $ = (id) => document.getElementById(id);
let pricing = null;
const state = { baseId: "B1", styles: {}, fees: {}, late: 0 };

function save() {
  try { localStorage.setItem("nailQuoteState", JSON.stringify(state)); } catch {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem("nailQuoteState") || "null");
    if (s && s.baseId) Object.assign(state, s);
  } catch {}
}

function renderBase() {
  $("baseGrid").innerHTML = "";
  for (const b of pricing.base) {
    const el = document.createElement("div");
    el.className = "base" + (b.id === state.baseId ? " on" : "");
    el.innerHTML = `
      <div class="t">${b.name}</div>
      <div class="p">¥${b.price}</div>
      <div class="d">${b.suitable ?? b.scene ?? ""}</div>`;
    el.onclick = () => { state.baseId = b.id; save(); renderBase(); calc(); };
    $("baseGrid").appendChild(el);
  }
}

function styleRule(s) {
  if (s.unit === "full_only") return `整手 ¥${s.full_hand}`;
  if (s.per_finger_min != null) return `¥${s.per_finger_min}–${s.per_finger_max}/指`;
  if (s.per_finger === 0 && (s.full_hand ?? 0) === 0) return "免费";
  if (s.per_finger != null && s.full_hand != null)
    return `¥${s.per_finger}/指 · 整手 ¥${s.full_hand}`;
  if (s.per_finger != null) return `¥${s.per_finger}/指`;
  return "";
}

function priceOf(style, fingers) {
  if (fingers === 0) return "—";
  const n = Math.min(fingers, 10);
  if (style.unit === "full_only") return n === 10 ? `¥${style.full_hand}` : "需整手";
  if (style.per_finger_min != null) return `¥${style.per_finger_min * n}–${style.per_finger_max * n}`;
  const per = style.per_finger ?? 0;
  if (style.full_hand != null && n >= 10) return `¥${style.full_hand}`;
  if (per === 0) return "免费";
  return `¥${per * n}`;
}

function renderStyles() {
  const box = $("styleList");
  box.innerHTML = "";
  for (const s of pricing.styles) {
    const f = state.styles[s.id] ?? 0;
    const row = document.createElement("div");
    row.className = "style-row" + (f === 0 ? " zero" : "");
    row.innerHTML = `
      <div>
        <div class="nm">${s.name}</div>
        <div class="rule">${styleRule(s)}${s.needs_confirm ? " · 需人工确认" : ""}</div>
      </div>
      <input type="range" min="0" max="10" step="1" value="${f}">
      <div class="val">${f === 0 ? "<span style='color:var(--muted)'>不做</span>" : `<b>${priceOf(s, f)}</b><br><span style="color:var(--muted);font-size:11px">${f} 指</span>`}</div>`;
    const range = row.querySelector("input");
    range.oninput = () => {
      state.styles[s.id] = Number(range.value);
      save(); renderStyles(); calc();
    };
    box.appendChild(row);
  }
}

function renderFees() {
  const box = $("feeList");
  box.innerHTML = "";
  for (const fee of pricing.fees) {
    const max = fee.unit === "per_finger" ? 10 : 1;
    const n = state.fees[fee.id] ?? 0;
    const row = document.createElement("div");
    row.className = "fee-row";
    row.innerHTML = `
      <div><div class="nm">${fee.name}</div><div class="pr">¥${fee.price}${fee.unit === "per_finger" ? "/指" : "/次"}</div></div>
      <div class="stepper">
        <button data-k="minus">−</button><span>${n}</span><button data-k="plus">+</button>
      </div>`;
    row.querySelector('[data-k="minus"]').onclick = () => {
      state.fees[fee.id] = Math.max(0, (state.fees[fee.id] ?? 0) - 1);
      save(); renderFees(); calc();
    };
    row.querySelector('[data-k="plus"]').onclick = () => {
      state.fees[fee.id] = Math.min(max, (state.fees[fee.id] ?? 0) + 1);
      save(); renderFees(); calc();
    };
    box.appendChild(row);
  }
}

let lastResult = null;

function calc() {
  const q = {
    baseId: state.baseId,
    styles: Object.entries(state.styles)
      .filter(([, f]) => f > 0)
      .map(([id, fingers]) => ({ id, fingers })),
    fees: Object.entries(state.fees)
      .filter(([, n]) => n > 0)
      .map(([id, count]) => ({ id, count })),
    lateMinutes: state.late || 0,
  };
  const r = quote(pricing, q);
  lastResult = r;

  $("total").textContent = r.totalText;
  $("total").className = "quote-total" + (r.cancelled ? " cancelled" : "");
  $("sub").textContent = `时长：${r.durationText}（含 1.5–2 倍工时）`;

  $("lines").innerHTML = r.lines
    .map((l) => `<li><span>${l.label}<span class="note">${l.note || ""}</span></span><span class="amt">${l.amount}</span></li>`)
    .join("");

  const uniq = [...new Set(r.pending)];
  $("pendingBox").innerHTML = uniq.length
    ? `<div class="pending"><b>需人工确认</b>${uniq.join("<br>")}</div>`
    : "";
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

$("copyBtn").onclick = async () => {
  if (!lastResult) return;
  const lines = lastResult.lines.map((l) => `${l.label}：${l.amount}`).join("\n");
  const text = `报价明细\n${lines}\n\n合计：${lastResult.totalText}\n预计时长：${lastResult.durationText}（做工较细，请预留）`;
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制，可发给客人");
  } catch {
    toast("复制失败，请手动选择");
  }
};

$("resetBtn").onclick = () => {
  state.baseId = "B1"; state.styles = {}; state.fees = {}; state.late = 0;
  $("lateMin").value = 0;
  save(); renderBase(); renderStyles(); renderFees(); calc();
};

$("lateMin").oninput = (e) => {
  state.late = Math.max(0, Number(e.target.value) || 0);
  save(); calc();
};

(async function init() {
  try {
    const res = await fetch("/knowledge/pricing.json");
    pricing = await res.json();
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend",
      `<div style="padding:20px;color:#b3453f">读不到 pricing.json，请用 node src/server.mjs 启动。</div>`);
    return;
  }
  load();
  $("lateMin").value = state.late || 0;
  renderBase(); renderStyles(); renderFees(); calc();
})();
</script>
</body>
</html>
