<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和美甲师聊聊 · Demo</title>
<style>
  :root {
    --bg: #faf6f4; --card: #fff; --ink: #2f2a2c; --muted: #8b8186;
    --line: #eee4e0; --rose: #c96f7f; --rose-soft: #f6e3e4; --warn-bg: #fdf5e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); height: 100vh;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 16px 20px 8px; max-width: 820px; margin: 0 auto; width: 100%; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }
  nav { margin-top: 8px; display: flex; gap: 14px; font-size: 12.5px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--rose); }
  nav a.on { color: var(--rose); font-weight: 600; }

  .chat {
    flex: 1; overflow-y: auto; padding: 10px 20px 20px;
    max-width: 820px; margin: 0 auto; width: 100%;
  }
  .msg { display: flex; margin-bottom: 14px; gap: 8px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 76%; padding: 10px 14px; border-radius: 14px;
    background: #fff; border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--rose); color: #fff; border-color: var(--rose); border-bottom-right-radius: 4px; }
  .msg.bot .bubble { border-bottom-left-radius: 4px; }
  .bubble strong { font-weight: 600; }
  .bubble table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 8px; }
  .bubble td, .bubble th { padding: 5px 6px; border-bottom: 1px dashed var(--line); text-align: left; vertical-align: top; }
  .bubble th { color: var(--muted); font-size: 12px; font-weight: 500; }
  .bubble .pt-title { font-weight: 600; margin: 10px 0 2px; font-size: 13.5px; }
  .bubble .pt-price { color: var(--rose); font-weight: 600; white-space: nowrap; }
  .bubble .pt-note { color: var(--muted); font-size: 11.5px; line-height: 1.5; }

  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-width: 76%; }
  .rcard {
    display: grid; grid-template-columns: 66px 1fr; gap: 10px; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; align-items: stretch;
  }
  .rcard img { width: 66px; height: 84px; object-fit: cover; display: block; background: #f2ebe8; }
  .rcard .rb { padding: 7px 10px 8px; }
  .rcard .rn { font-weight: 600; font-size: 13px; }
  .rcard .rp { color: var(--rose); font-weight: 700; font-size: 14px; }
  .rcard .rr { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.35; }

  .typing { color: var(--muted); font-size: 12.5px; padding-left: 4px; }

  .composer { padding: 10px 20px 18px; max-width: 820px; margin: 0 auto; width: 100%; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .quick button {
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: #6f6468; cursor: pointer;
  }
  .quick button:hover { border-color: var(--rose); color: var(--rose); }
  .inputrow { display: flex; gap: 8px; }
  .inputrow input {
    flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; background: #fff; outline: none;
  }
  .inputrow input[type=file] {
    position: absolute; width: 1px; height: 1px; opacity: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .diag {
    position: fixed; right: 14px; top: 14px; z-index: 60;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .diagbox {
    display: none; margin: 10px auto 0; max-width: 820px; width: calc(100% - 40px);
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: #5d5256; white-space: pre-wrap; line-height: 1.7;
  }
  .diagbox.on { display: block; }
  .inputrow input:focus { border-color: var(--rose); }
  .imgbtn {
    padding: 0 13px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 17px; line-height: 1;
    display: flex; align-items: center;
  }
  .imgbtn:hover { border-color: var(--rose); }
  .preview { display: none; margin-top: 8px; align-items: center; gap: 8px; }
  .preview.on { display: flex; }
  .preview img { height: 64px; border-radius: 8px; border: 1px solid var(--line); }
  .preview .x {
    border: 0; background: #f2ebe8; color: #8b8186; width: 22px; height: 22px;
    border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .preview .hint { color: var(--muted); font-size: 12px; }
  .inputrow button {
    padding: 0 20px; border: none; border-radius: 12px; background: var(--rose);
    color: #fff; font: inherit; cursor: pointer;
  }
  .inputrow button:disabled { opacity: .5; cursor: default; }
  .tip { color: #b9adb1; font-size: 11px; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>和美甲师聊聊</h1>
  <div class="sub">AI 助手先接待，价格和款式从真实价目表、真实款式库里取。</div>
  <nav>
    <a href="/web/chat.html" class="on">AI 对话</a>
    <a href="/web/recommend.html">选款推荐</a>
    <a href="/web/gallery.html">款式图库</a>
    <a href="/web/">报价器</a>
  </nav>
</header>

<div class="chat" id="chat"></div>
<div class="diagbox" id="diagbox"></div>

<div class="composer">
  <div class="quick" id="quick">
    <button data-action="upload">📷 发图问价</button>
    <button data-action="send">🤔 帮我推荐</button>
    <button data-action="price">📋 获取价格表</button>
    <button data-action="send">周六有空吗</button>
  </div>
  <div class="inputrow">
    <label class="imgbtn" id="imgbtn" for="file" title="发参考图">📷</label>
    <input type="file" id="file" accept="image/*">
    <input id="input" placeholder="比如：我手黑，想做显白一点的，预算100左右" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div class="preview" id="preview"></div>
  <div class="tip">体验版：价格以到店确认为准；档期需本人确认</div>
</div>
<button class="diag" id="diag">ⓘ 发不了图？</button>

<script type="module">
const $ = (id) => document.getElementById(id);
const history = [];
let busy = false;
let pendingImage = null;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > max) {
        const r = max / Math.max(w, h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function handleFile(f) {
  if (!f || !f.type.startsWith("image/")) {
    alert("只支持图片文件，换一张 JPG / PNG 试试");
    return;
  }
  try {
    const b64 = await fileToBase64(f);
    pendingImage = { data: b64, mime: "image/jpeg" };
    $("preview").classList.add("on");
    $("preview").innerHTML = `
      <img src="data:image/jpeg;base64,${b64}" alt="预览">
      <span class="hint">图已选好，点「发送」发出去</span>
      <button class="x" id="rmimg" title="移除">×</button>`;
    $("rmimg").onclick = clearImage;
    $("input").focus();
  } catch (err) {
    console.error("图片读取失败", err);
    alert("这张图读不出来（可能是 HEIC 格式），换一张 JPG / PNG 试试");
  }
}

function clearImage() {
  pendingImage = null;
  $("preview").classList.remove("on");
  $("preview").innerHTML = "";
  $("file").value = "";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}

function addMsg(role, text, cards) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = fmt(text);
  wrap.appendChild(b);
  $("chat").appendChild(wrap);

  if (cards?.length) {
    const box = document.createElement("div");
    box.className = "cards";
    box.style.marginLeft = "0";
    box.innerHTML = cards.map((c) => `
      <div class="rcard">
        <img src="${c.img}" alt="${esc(c.name)}">
        <div class="rb">
          <div class="rn">${esc(c.name)}</div>
          <div class="rp">${esc(c.priceText)}</div>
          <div class="rr">${esc(c.reason)}　${esc(c.durationText)}</div>
        </div>
      </div>`).join("");
    $("chat").appendChild(box);
  }

  $("chat").scrollTop = $("chat").scrollHeight;
}

function addHtml(role, html) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  wrap.appendChild(b);
  $("chat").appendChild(wrap);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function buildPriceHtml(p) {
  const baseRows = p.base
    .map((b) => `<tr><td>${b.name}</td><td class="pt-price">¥${b.price}</td><td class="pt-note">${b.suitable || ""}</td></tr>`)
    .join("");

  const styleRows = [
    ["钻饰（小钻 / 单钻）", "免费", "随便加"],
    ["法式 / 波点 / 腮红 / 渐变 / 晕染", "单指 2 元 · 整手 8 元", "这几种共用指次，每满 10 指次收 8 元"],
    ["极简手绘（细线条 / 简笔画）", "单指 3 元 · 整手 10 元", ""],
    ["稍复杂手绘", "5 元/指", "没有整手打包价"],
    ["卡通图案", "5–10 元/指", "具体看图案"],
    ["款式钻 / 堆钻 / 浮雕 / 醋酸", "5–10 元/指", "具体看款式"],
    ["魔镜粉 / 海莉粉 / 蹭粉", "整手 10 元 · 单指 2 元", "做几个手指先确认"],
  ]
    .map(([n, pr, note]) => `<tr><td>${n}</td><td class="pt-price">${pr}</td><td class="pt-note">${note}</td></tr>`)
    .join("");

  const feeRows = p.fees
    .map(
      (f) =>
        `<tr><td>${f.name}</td><td class="pt-price">¥${f.price}</td><td class="pt-note">${f.unit === "per_finger" ? "按手指数" : "每次"}</td></tr>`
    )
    .join("");

  return `
    <div class="pt-title">基础项目（含卸本甲 + 去死皮 + 湿处理）</div>
    <table><thead><tr><th>项目</th><th>价格</th><th>适合 / 注意</th></tr></thead><tbody>${baseRows}</tbody></table>
    <div class="pt-title">款式加价</div>
    <table><thead><tr><th>做法</th><th>价格</th><th>说明</th></tr></thead><tbody>${styleRows}</tbody></table>
    <div class="pt-title">其他</div>
    <table><thead><tr><th>项目</th><th>价格</th><th></th></tr></thead><tbody>${feeRows}</tbody></table>
    <div class="pt-note" style="margin-top:8px">
      迟到：10 分钟内免费，10–30 分钟每分钟 1 元，超 30 分钟取消且不再接单。<br>
      做工时长是普通店的 1.5–2 倍（本甲 2–3 小时，延长 3–4 小时），不留够时间会做不完。<br>
      不满意可当场卸甲，不收钱。
    </div>`;
}

async function showPriceTable() {
  try {
    const p = await fetch("/knowledge/pricing.json").then((r) => r.json());
    addMsg("user", "获取价格表");
    addHtml("bot", buildPriceHtml(p));
    history.push({ role: "user", content: "（点了获取价格表）" });
    history.push({ role: "assistant", content: "[已向客人展示完整价格表]" });
  } catch {
    addMsg("bot", "价格表加载失败，刷新一下页面再试？");
  }
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typing";
  el.textContent = "对方正在输入…";
  $("chat").appendChild(el);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function delTyping() {
  $("typing")?.remove();
}

async function pollLooks(taskId) {
  addMsg("bot", "🎨 正在给你画效果图，大概 1 分钟，画好自动发你…");
  const deadline = Date.now() + 180000;
  while (Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, 3000));
    let t;
    try {
      t = await fetch("/api/looks/" + taskId).then((r) => r.json());
    } catch {
      continue;
    }
    if (t.status === "done") {
      const imgs = t.images
        .map(
          (im) =>
            `<div style="margin:8px 0"><img src="${im.url}" loading="lazy" style="width:100%;border-radius:12px;border:1px solid var(--line);display:block"></div>`
        )
        .join("");
      addHtml(
        "bot",
        `<div class="pt-title">给你画了 ${t.images.length} 张效果图</div>${imgs}<div class="pt-note">这些是 AI 画的效果图，参考风格用；实际做出来什么样，以本人确认为准。</div>`
      );
      history.push({ role: "assistant", content: "[已给客人发了 AI 生成的效果图]" });
      return;
    }
    if (t.status === "failed") {
      addMsg("bot", "这张没画出来（生图服务偶尔会抽）。你再点一次「🤔 帮我推荐」，我重新画。");
      return;
    }
    if (t.status === "missing") {
      addMsg("bot", "图弄丢了，再点一次「🤔 帮我推荐」我重新画一张。");
      return;
    }
  }
  addMsg("bot", "图还在画，稍等一会儿我再发你。");
}

async function send(text) {
  if (busy || (!text.trim() && !pendingImage)) return;
  const img = pendingImage;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";

  const shown = (text.trim() || "") + (img ? (text.trim() ? "　[图片]" : "[图片]") : "");
  addMsg("user", shown);
  history.push({
    role: "user",
    content: (text.trim() || "（我发了一张图）") + (img ? "（附了一张参考图）" : ""),
  });
  if (img) clearImage();
  addTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history, image: img || undefined }),
    });
    const data = await res.json();
    delTyping();
    if (data.error) {
      addMsg("bot", "哎呀出错了：" + data.error);
    } else {
      history.push({ role: "assistant", content: data.reply });
      const cardNote = data.cards?.length
        ? "\n（这一轮推荐的款式：" + data.cards.map((c) => `${c.id} ${c.name} ${c.priceText}`).join("；") + "）"
        : "";
      history[history.length - 1].content += cardNote;
      addMsg("bot", data.reply, data.cards);
      if (data.looks) pollLooks(data.looks);
    }
  } catch (e) {
    delTyping();
    addMsg("bot", "网络不太行，再试一次？");
  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
}

$("send").onclick = () => send($("input").value);
$("input").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); }
};
$("quick").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.action === "upload") {
    $("file").click();
    return;
  }
  if (b.dataset.action === "price") {
    showPriceTable();
    return;
  }
  send(b.textContent.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, "").trim());
};

let lastEvent = "还没操作过";

function markEvent(s) {
  lastEvent = s;
  console.log("[chat]", s);
}

$("imgbtn").addEventListener("click", () => markEvent("点了 📷 按钮"));
$("file").addEventListener("click", () => markEvent("文件选择框被唤起（如果这里没弹出，是浏览器拦的）"));
$("file").onchange = (e) => {
  markEvent(`选完文件了：${e.target.files?.[0]?.name || "空"}`);
  handleFile(e.target.files?.[0]);
};

$("diag").onclick = () => {
  const box = $("diagbox");
  box.classList.toggle("on");
  if (!box.classList.contains("on")) return;
  box.textContent = [
    `最后一步：${lastEvent}`,
    `是否嵌在 iframe 里：${window.self !== window.top ? "是 —— 这会导致选图被拦" : "不是"}`,
    `页面地址：${location.href}`,
    `浏览器：${navigator.userAgent}`,
    `支持选文件：${"files" in document.createElement("input") ? "是" : "否"}`,
    `图片已选：${pendingImage ? "是" : "否"}`,
  ].join("\n");
};

// 粘贴图片（截图后 Ctrl+V）
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
  if (item) {
    e.preventDefault();
    handleFile(item.getAsFile());
  }
});

// 拖拽图片到页面
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) handleFile(f);
});

addMsg("bot", "嗨～三种方式，看你怎么方便：\n\n① 已经有喜欢的款 → 把图直接发我，我看看是什么做法、大概多少钱\n② 还没想好 → 说说你的手（比如偏黄、指甲短）、预算或想要的风格，我给你挑几款\n③ 想先看价格 → 点「📋 获取价格表」，全部价目直接发你\n\n随便挑一个先聊～");

// 分享用：chat.html?price=1 直接展开价格表
if (new URLSearchParams(location.search).get("price") === "1") {
  setTimeout(showPriceTable, 300);
}

$("input").focus();
</script>
</body>
</html>
